model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  use_flash_attention_2: false

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  learning_rate: 3.0e-6
  max_steps: 500
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  logging_steps: 5
  save_steps: 50
  kl_beta: 0.06

rollout:
  group_size: 4
  max_tokens: 2200

rewards:
  weights:
    w_length: 0.40
    w_coherence: 0.30
    w_quality: 0.30

  coherence:
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
    tail_words: 150
    head_words: 150

  quality:
    alpha_fluency: 0.40
    beta_richness: 0.30
    gamma_burstiness: 0.30
    burstiness_mu0: 12.0
    burstiness_sigma0: 6.0
